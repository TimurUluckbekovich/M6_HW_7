services:
  backend:
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - back_static:/app/back_static
      - back_media:/app/back_media

volumes:
  back_static:
  back_media: